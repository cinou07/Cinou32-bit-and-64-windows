name: Build CinouAI Linux

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build AppImage
        run: npm run build:linux -- --x64

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: CinouAI-Linux
          path: dist/*.AppImage