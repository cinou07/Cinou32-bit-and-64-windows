name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 and ia32
        run: npm run build -- --win --x64 --ia32

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: CinouAI-Windows-x64-ia32
          path: dist/*